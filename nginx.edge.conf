events {
  worker_connections 1024;
}

error_log /dev/stderr info;

http {
  access_log /dev/stdout;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cdn_cache:10m max_size=50m inactive=10m use_temp_path=off;

  upstream origin_upstream {
    server origin-a:8080 max_fails=2 fail_timeout=10s;
    server origin-b:8080 backup;
    keepalive 8;
  }

  server {
    listen 8080;

    location / {
      set_by_lua_block $cache_key {
        return ngx.var.uri
      }

      proxy_pass http://origin_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_cache cdn_cache;
      proxy_cache_key $cache_key;

      proxy_cache_lock on;
      proxy_cache_lock_timeout 2s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503;

      proxy_read_timeout 2s;
      proxy_send_timeout 2s;
      proxy_ignore_client_abort on;

      proxy_buffering on;
      proxy_buffers 16 16k;

      add_header X-CDN-Node $hostname always;
      add_header X-Cache-Key $cache_key always;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header X-Upstream-Status $upstream_status always;
      #add_header X-Upstream-Addr $upstream_addr always;
    }
  }
}
